# DocumentIntelligence pipeline manifest.
#
# Which plugin fills each stage, and how each one is configured. Choosing a plugin and
# configuring it happen in the same place, so there is nothing to hunt for afterwards.
#
# Committable by design: no secrets here, only ${VAR} references resolved from the
# environment at load. Settings can also be overridden per plugin with a namespaced
# variable -- DI_OPENAI_MODEL, DI_ANTHROPIC_EFFORT -- or by a command-line flag.

[pipeline]
# docTR everywhere, not the cascade. Measured on 75 degraded documents, same model and
# prompts, only the OCR engine varying: docTR beat the cascade on every profile, by 31
# points on photographs. The cascade's whole argument was cost, and the cost was not
# real -- 3.6s a document against docTR's 4.0s, on a stage that is cached and paid once,
# against 7.4 hours of extraction. See the README.
splitter = "every_page"
normalizer = "doctr"
extractor = "openai"

# The page image alone, no OCR. Measured on held-out documents drawn from page designs
# training never saw, the three candidates went: LLM reading docTR text 0.571 on fax,
# LayoutLMv3 on words+boxes+image 0.943, DiT on the image alone 0.958. Dropping the
# text made it better -- on a 170 dpi fax docTR finds 62% of the words, so the text
# branch is least reliable exactly where the image branch is working hardest.
#
# It also reads no text at all, so this stage runs before the normalizer and costs a
# page render rather than an OCR pass.
classifier = "cascade"

# Every rule, which is the default when this is blank. A rule ships only after the
# self-test shows it firing on no clean document, so there is no reason to run a
# subset; naming them here is for turning one off deliberately, and for seeing at a
# glance what checks a number was produced under.
validator = "arithmetic, format, range, required, temporal"

# Who sees the answer. Everything before this stage decides what the document says;
# this decides whether a person has to check it. Added in Phase 5, because until there
# was something measured to route on there was nothing for it to do.
router = "policy"

# ------------------------------------------------------------------ splitters
# Measured on 120 bundles holding 333 documents. The classifier-per-page splitter,
# which cuts where the predicted type changes, lost to cutting everywhere:
#
#   every_page   F1 0.938   files exactly right 0.783   merged  0   over-cut 28
#   by_type      F1 0.772   files exactly right 0.458   merged 62   over-cut 27
#
# 92% of documents in this corpus are a single page, so cutting everywhere is wrong 28
# times, while by_type misses 62 joins where one document follows another of its own
# type -- a change-of-type signal cannot see those, and half the joins here are of that
# shape. It loses on the more expensive axis too: a merge hands the extractor two
# unrelated documents and produces a record for a document that never existed, and
# every_page makes none.
#
# by_type stays selectable. It is the right shape wherever multi-page documents are
# common, which this corpus is not, and it is what produced the comparison above.

# ------------------------------------------------------------------ classifiers

[classifiers.dit]
model = "models/dit-balanced"
# Every error this model made on unseen-design faxes arrived below 0.90, so this floor
# answers 88.7% of them with none wrong and sends the rest to a person. It is set here
# rather than defaulted in the plugin because it is the number that governs what the
# pipeline does, and the manifest is where those live.
#
# Documents it declines are the ones there was nothing to read on: docTR found a mean
# of 11.3 words on them against 123.0 on the ones it answered.
abstain_below = 0.9
device = "auto"

[classifiers.layout]
# The class-weighted LayoutLMv3. Kept selectable for comparison; `dit` beats it on
# every profile and trains in a fifth of the time.
model = "models/layout-balanced"
abstain_below = 0.9

[classifiers.llm]
# Text only. 0.990 on clean documents and 0.571 on faxes -- the gap is OCR, not
# comprehension.

# ------------------------------------------------------------------ validators

[validators.arithmetic]
# Cents of slack. Not zero: every figure on these documents is printed rounded to the
# cent, so a subtotal recomputed from rounded line amounts disagrees by fractions
# legitimately, and a rule with no tolerance reports a defect rate that is mostly
# rounding. Wide enough to absorb that and nothing else -- the injected mismatches run
# from 8 to 260 dollars, so there is a lot of daylight between the two.
tolerance = 0.02

# ------------------------------------------------------------------ extractors

[extractors.openai]
# Anything speaking OpenAI chat-completions: LM Studio, Ollama, vLLM, llama.cpp.
# A named endpoint rather than host.docker.internal: it resolves the same from the
# host, from a container, and from another machine on the tailnet.
#
# These two must name something the endpoint actually serves. They previously did not
# -- the model was one no longer loaded and the base_url pointed at a workstation --
# and every run overrode both from the environment, so nothing failed for the person
# who already knew the right values and everything failed for anyone else. Check
# against `extract.cli config` and the endpoint's /v1/models before changing them.
base_url = "https://ai.ramonecung.com/v1"
model = "qwen/qwen3-vl-8b"
api_key = "${DI_OPENAI_API_KEY}"
# Resumes are the long tail: a full work history plus skills runs past 26,000
# characters of JSON, and at 8000 the model was still writing when the budget ran out
# -- twelve of forty failed that way on the first full corpus run. Thinking tokens
# come out of the same allowance, so the headroom has to cover both.
max_tokens = 16000
timeout = 600
json_mode = "auto"
no_think = false

[extractors.anthropic]
model = "claude-opus-5"
effort = "high"
max_tokens = 8000
api_key = "${ANTHROPIC_API_KEY}"

# ------------------------------------------------------------------ rules
# Deterministic cleanup applied to every extraction. On by default -- a rule ships
# because it is correct, so switching one off is the deliberate act. `extract.cli rules`
# lists them with their scope.
#
# Only things true by definition belong here. A rule that corrects the model's
# judgement makes the extractor look better and the evaluation meaningless.

[rules]
drop_rollup_rows = true
drop_empty_rows = true

[classifiers.cascade]
# DiT reads the page and is right about almost everything except purchase orders,
# which it calls invoices on designs it has not seen: 0.125 recall, 14 of 16. The two
# are both a header, a ruled table and a totals block, and what separates them is a
# phrase printed at the top. So the text is consulted for that pair and for anything
# DiT is unsure of, and nothing else -- which keeps the OCR bill on the minority of
# documents that need it rather than the whole corpus.
primary = "dit"
secondary = "keyword"
ambiguous = "invoice|purchase_order"
# Zero, not 0.9. Measured on unseen page designs: the pair trigger alone scores 0.944
# and escalates 22% of documents; adding a 0.9 confidence floor escalates 56% and
# scores exactly the same 0.944. The extra escalations were all documents the image
# model was going to get right anyway, and each one is an OCR pass.
escalate_below = 0.0

# What the escalation buys, and where it stops buying anything. Cascade against its own
# primary on the design holdout, at matched coverage:
#
#   floor   coverage   DiT alone   cascade    gain
#   0.50     0.944      0.824       0.904     +0.081
#   0.60     0.771      0.910       0.946     +0.036
#   0.70     0.618      0.966       0.978     +0.011
#   0.75     0.576      0.976       0.976     +0.000
#   0.85     0.472      1.000       1.000     +0.000
#
# Every document the text arbiter rescues sits below 0.75, so at the 0.85 floor set
# below the cascade and bare DiT are the same pipeline and the OCR is spent for
# nothing. The arbiter earns its cost only if the floor is lowered for throughput.
# Worth knowing before reading 0.944 overall as an argument for the escalation at any
# operating point.

# The floor that actually governs this pipeline, measured on the cascade rather than
# inherited from its primary.
#
# `[classifiers.dit] abstain_below = 0.9` above does nothing while the cascade is the
# chosen classifier: the cascade builds its members with abstention disabled on
# purpose, because a primary that declines internally hands back no answer and no
# runner-up, and the escalation then has nothing to arbitrate. So the floor has to be
# stated here or it is not stated at all. It read as set for as long as it was not.
#
# 0.85, from `eval.cli calibrate --report reports/cascade-template.json` -- the cascade
# run over documents held out by page design, which is the split that does not let the
# model recognise a layout it trained on:
#
#   floor   coverage   accuracy   errors through
#   0.60     0.771      0.946      6
#   0.70     0.618      0.978      2
#   0.85     0.472      1.000      0
#   0.90     0.438      1.000      0
#
# 0.85 rather than 0.90 because they answer with the same zero errors and 0.85 answers
# five points more of the corpus. 0.90 was giving away coverage for nothing, which is
# what an unmeasured floor does.
#
# The honest reading of 0.472 is that on page designs it has never seen, this model can
# be trusted unsupervised on slightly under half the corpus. Lowering the floor to 0.60
# answers 77% at 0.946 -- six wrong documents in 144 -- and that is a throughput
# decision rather than a modelling one, which is why the table is here and not just the
# number.
abstain_below = 0.85

# ------------------------------------------------------------------ router
# Independent gates, not one blended score. Two things were measured and both point
# here: the classifier's confidence is well calibrated for classification and carries
# almost nothing about whether the extraction was right (lift +0.028 against +0.120
# for the best observable signal), and a wrong type is a different failure from a bad
# field -- the type chose the schema, so nothing downstream of it can be right.
#
# Every threshold below is a number produced by `eval.cli signals` or
# `eval.cli calibrate`, and lives here so the figure that governs the pipeline sits
# next to the evidence for it.

[routers.policy]
# The measured zero-error floor from the cascade's design holdout. See the note under
# [classifiers.cascade]; this is the same number, applied at the routing stage rather
# than inside the classifier, so a declined document is queued rather than discarded.
classifier_floor = 0.85
# Measured cost of that floor on documents whose designs the model *has* seen: on the
# 175-document clean run it routes 23 documents, always as the only gate to fire, and
# those 23 extracted at a mean field accuracy of 0.992. On seen designs this gate is
# almost pure cost. It is kept at 0.85 anyway, because the deployment assumption is
# vendor templates nobody trained on -- which is the case the number was measured for,
# and where classification accuracy falls to 0.875. Lower it only for a corpus known to
# be all-familiar, and know that is what you are asserting.

# The strongest single signal in the corpus: rank correlation -0.786 with field
# accuracy, lift +0.120 at 80% coverage, and the best signal inside every document
# type -- which is what makes it trustworthy, since the classifier's own confidence
# failed exactly that test. On the 1,055 degraded documents:
#
#   ceiling   reviewed   accepted   accuracy of accepted
#   0.1        664        391        0.838
#   0.2        469        586        0.805
#   0.3        418        637        0.770
#   none         0       1055        0.552
#
# 0.2 holds the accepted half above 0.80 mean field accuracy against a 0.552 corpus
# baseline. Tightening to 0.1 buys three points and sends another 195 documents to a
# person, which is a throughput decision and not a modelling one.
blank_share_ceiling = 0.2

# Zero means any error routes the document, which is the entire point of a rule being
# severity error rather than warning. Warnings deliberately do not gate: measured at
# lift +0.001, they carry nothing, and routing on them would cost reviewer time for no
# accuracy. That warnings are inert and errors are not is the Phase 4 severity split
# paying for itself.
validator_errors_ceiling = 0

# Off. Both carry real lift on their own -- 0.105 and 0.107 -- but they are largely
# reading the same thing blank_share reads, from the other end: a page that could not
# be read produces an answer full of blanks. Turn one on only if the `alone` column of
# `route.cli score` shows it catching documents nothing else does.
ocr_confidence_floor = 0.0
words_floor = 0.0
