# DocumentIntelligence pipeline manifest.
#
# Which plugin fills each stage, and how each one is configured. Choosing a plugin and
# configuring it happen in the same place, so there is nothing to hunt for afterwards.
#
# Committable by design: no secrets here, only ${VAR} references resolved from the
# environment at load. Settings can also be overridden per plugin with a namespaced
# variable -- DI_OPENAI_MODEL, DI_ANTHROPIC_EFFORT -- or by a command-line flag.

[pipeline]
# docTR everywhere, not the cascade. Measured on 75 degraded documents, same model and
# prompts, only the OCR engine varying: docTR beat the cascade on every profile, by 31
# points on photographs. The cascade's whole argument was cost, and the cost was not
# real -- 3.6s a document against docTR's 4.0s, on a stage that is cached and paid once,
# against 7.4 hours of extraction. See the README.
splitter = "every_page"
normalizer = "doctr"
extractor = "openai"

# The page image alone, no OCR. Measured on held-out documents drawn from page designs
# training never saw, the three candidates went: LLM reading docTR text 0.571 on fax,
# LayoutLMv3 on words+boxes+image 0.943, DiT on the image alone 0.958. Dropping the
# text made it better -- on a 170 dpi fax docTR finds 62% of the words, so the text
# branch is least reliable exactly where the image branch is working hardest.
#
# It also reads no text at all, so this stage runs before the normalizer and costs a
# page render rather than an OCR pass.
classifier = "cascade"

# ------------------------------------------------------------------ splitters
# Measured on 120 bundles holding 333 documents. The classifier-per-page splitter,
# which cuts where the predicted type changes, lost to cutting everywhere:
#
#   every_page   F1 0.938   files exactly right 0.783   merged  0   over-cut 28
#   by_type      F1 0.772   files exactly right 0.458   merged 62   over-cut 27
#
# 92% of documents in this corpus are a single page, so cutting everywhere is wrong 28
# times, while by_type misses 62 joins where one document follows another of its own
# type -- a change-of-type signal cannot see those, and half the joins here are of that
# shape. It loses on the more expensive axis too: a merge hands the extractor two
# unrelated documents and produces a record for a document that never existed, and
# every_page makes none.
#
# by_type stays selectable. It is the right shape wherever multi-page documents are
# common, which this corpus is not, and it is what produced the comparison above.

# ------------------------------------------------------------------ classifiers

[classifiers.dit]
model = "models/dit-balanced"
# Every error this model made on unseen-design faxes arrived below 0.90, so this floor
# answers 88.7% of them with none wrong and sends the rest to a person. It is set here
# rather than defaulted in the plugin because it is the number that governs what the
# pipeline does, and the manifest is where those live.
#
# Documents it declines are the ones there was nothing to read on: docTR found a mean
# of 11.3 words on them against 123.0 on the ones it answered.
abstain_below = 0.9
device = "auto"

[classifiers.layout]
# The class-weighted LayoutLMv3. Kept selectable for comparison; `dit` beats it on
# every profile and trains in a fifth of the time.
model = "models/layout-balanced"
abstain_below = 0.9

[classifiers.llm]
# Text only. 0.990 on clean documents and 0.571 on faxes -- the gap is OCR, not
# comprehension.

# ------------------------------------------------------------------ extractors

[extractors.openai]
# Anything speaking OpenAI chat-completions: LM Studio, Ollama, vLLM, llama.cpp.
# A named endpoint rather than host.docker.internal: it resolves the same from the
# host, from a container, and from another machine on the tailnet.
#
# These two must name something the endpoint actually serves. They previously did not
# -- the model was one no longer loaded and the base_url pointed at a workstation --
# and every run overrode both from the environment, so nothing failed for the person
# who already knew the right values and everything failed for anyone else. Check
# against `extract.cli config` and the endpoint's /v1/models before changing them.
base_url = "https://ai.ramonecung.com/v1"
model = "qwen/qwen3-vl-8b"
api_key = "${DI_OPENAI_API_KEY}"
# Resumes are the long tail: a full work history plus skills runs past 26,000
# characters of JSON, and at 8000 the model was still writing when the budget ran out
# -- twelve of forty failed that way on the first full corpus run. Thinking tokens
# come out of the same allowance, so the headroom has to cover both.
max_tokens = 16000
timeout = 600
json_mode = "auto"
no_think = false

[extractors.anthropic]
model = "claude-opus-5"
effort = "high"
max_tokens = 8000
api_key = "${ANTHROPIC_API_KEY}"

# ------------------------------------------------------------------ rules
# Deterministic cleanup applied to every extraction. On by default -- a rule ships
# because it is correct, so switching one off is the deliberate act. `extract.cli rules`
# lists them with their scope.
#
# Only things true by definition belong here. A rule that corrects the model's
# judgement makes the extractor look better and the evaluation meaningless.

[rules]
drop_rollup_rows = true
drop_empty_rows = true

[classifiers.cascade]
# DiT reads the page and is right about almost everything except purchase orders,
# which it calls invoices on designs it has not seen: 0.125 recall, 14 of 16. The two
# are both a header, a ruled table and a totals block, and what separates them is a
# phrase printed at the top. So the text is consulted for that pair and for anything
# DiT is unsure of, and nothing else -- which keeps the OCR bill on the minority of
# documents that need it rather than the whole corpus.
primary = "dit"
secondary = "keyword"
ambiguous = "invoice|purchase_order"
# Zero, not 0.9. Measured on unseen page designs: the pair trigger alone scores 0.944
# and escalates 22% of documents; adding a 0.9 confidence floor escalates 56% and
# scores exactly the same 0.944. The extra escalations were all documents the image
# model was going to get right anyway, and each one is an OCR pass.
escalate_below = 0.0
