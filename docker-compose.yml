# DocumentIntelligence
#
# Two images. `di-app` is the application -- today it runs the evaluation CLI, and
# the web server and worker become further services off this same build, since they
# share a codebase and a dependency set. `di-document-generator` stays separate: it
# needs Chromium and the augraphy stack, ~2.4 GB the application has no use for.
#
# Both sit behind the "tools" profile, so `docker compose up` starts nothing. They
# are on-demand: `docker compose run` gives them one job and discards the container.
#
#   docker compose run --rm document-generator build
#   docker compose run --rm evaluator selftest
#   docker compose run --rm evaluator score --predictions /reports/preds.jsonl

services:
  document-generator:
    build:
      context: ./tools/document-generator
    image: di-document-generator
    container_name: di-document-generator
    profiles: ["tools"]
    volumes:
      - ./data:/data             # the corpus lands here on the host
    environment:
      DI_DATASET_ROOT: /data
    # Chromium is happier with more than the default 64MB of shared memory.
    shm_size: "1gb"
    restart: "no"

  extractor:
    build:
      context: .
    image: di-app
    container_name: di-extractor
    profiles: ["tools"]
    entrypoint: ["python", "-m", "extract.cli"]
    volumes:
      - ./data:/data:ro          # documents in
      - ./reports:/reports       # predictions out
    environment:
      DI_DATASET_ROOT: /data
      DI_REPORTS_DIR: /reports
      # Which model answers. Everything here comes from .env (see .env.example);
      # switching between a local model and the Claude API is one variable.
      DI_BACKEND: ${DI_BACKEND:-openai}
      DI_BASE_URL: ${DI_BASE_URL:-http://host.docker.internal:1234/v1}
      DI_MODEL: ${DI_MODEL:-}
      DI_MAX_TOKENS: ${DI_MAX_TOKENS:-8000}
      DI_TIMEOUT: ${DI_TIMEOUT:-600}
      DI_EFFORT: ${DI_EFFORT:-high}
      # Credentials come from the host environment and are never baked into the image.
      DI_API_KEY: ${DI_API_KEY:-}
      DI_BASIC_AUTH: ${DI_BASIC_AUTH:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    # Lets the container reach a model server running on the host. Docker Desktop
    # provides host.docker.internal already; this adds it on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  evaluator:
    build:
      context: .
    image: di-app
    container_name: di-evaluator
    profiles: ["tools"]
    volumes:
      # The corpus is input. Mounting it read-only makes "eval quietly mutated the
      # ground truth" structurally impossible rather than merely unlikely.
      - ./data:/data:ro
      - ./reports:/reports
    environment:
      DI_DATASET_ROOT: /data
      DI_REPORTS_DIR: /reports
    restart: "no"
